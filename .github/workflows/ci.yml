name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and run
        # No ESP toolchain and no board. The suite compiles the pure logic for the
        # host with -Werror and runs it under ASan and UBSan, which is what makes
        # the parser tests worth feeding malformed input.
        run: make -C test/host

      - name: Routes match the contract
        # docs/http-api.md is what a hub is written against, and the usual way a
        # contract document stops being true is a route added in a hurry and
        # written down later. Paths only — the fields and statuses are prose.
        run: sh test/check-contract.sh

      - name: Lint the shell checks
        run: shellcheck --severity=style test/check-contract.sh test/check-static.sh

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cppcheck
        # From the runner's archive, unpinned, the same way this workflow and the
        # hub's take shellcheck. The cost is that a cppcheck release can fail a
        # build nothing changed in; the alternative is a pinned version that stops
        # learning new checks, which for an analyser is the wrong way round.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cppcheck
          cppcheck --version

      - name: Analyse
        # The firmware build already fails on any compiler warning. This follows a
        # value across branches instead, which is the class of defect a warning
        # cannot see and no test here can reach without a radio and a panel.
        run: sh test/check-static.sh

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    # Pinned to the minimum `main/idf_component.yml` declares. A floating tag
    # would mean a green run here says nothing about the version anyone is told
    # to build with, and building above the floor would leave the floor itself
    # untested.
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trust the checkout
        # The container runs as root and the checkout is owned by the runner user,
        # which git refuses to touch. idf.py reads the revision for the build.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          . "$IDF_PATH/export.sh"
          idf.py build 2>&1 | tee build.log

      - name: Fail on any compiler warning
        # Checked against the log rather than by forcing -Werror into the build.
        # ESP-IDF compiles its own components with this one, and a flag pushed in
        # from outside would fail the run on a warning in the framework that
        # nothing in this repository can fix.
        run: |
          if grep -E ": (warning|note: in expansion of macro)" build.log \
              | grep -vE "/opt/esp/idf/|/root/.espressif/"; then
            echo "::error::the firmware build produced warnings in this repository's code"
            exit 1
          fi
          echo "No warnings from this repository's own sources."

      - name: Report the binary size
        # Not a gate. 4 MB of flash is a lot of room, and a threshold nobody has a
        # reason for is a threshold that gets raised rather than read.
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py size
